plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.14'
	id 'maven-publish'
}

version = "${project.mod_version}+mc.${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.nucleoid.xyz/" }
	maven { url "https://maven.blamejared.com/" }
	maven { url "https://modmaven.dev" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"polydex-bridge" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "eu.pb4:sgui:${project.sgui_version}"
	implementation "eu.pb4:polydex:${project.polydex_version}"
	compileOnly("mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}")
	runtimeOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}")
	implementation include("eu.pb4:polymer-core:0.17.3+26.2")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}